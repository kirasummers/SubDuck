[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subduck"
version = "1.0.0"
description = "Desktop tool for muting trigger words and redacting subtitles in video files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Akira Summers", email = "code@kirasummers.co.uk"}
]
dependencies = [
    "PySide6>=6.5.0",
    "faster-whisper>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
subduck = "subduck.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["subduck"]
