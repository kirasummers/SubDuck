[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subduck"
version = "1.0.0"
description = "Video trigger word censorship and audio ducking studio"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Akira Summers"}
]
dependencies = [
    "PySide6>=6.5.0"
]

[project.scripts]
subduck = "subduck.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["subduck"]
